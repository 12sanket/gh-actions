name: Build and Push Docker Image
 
on:
 workflow_dispatch:
 push:
   branches:
     - main # Trigger on pushes to the main branch
 pull_request:
   branches:
     - main # Trigger on pull requests targeting the main branch
 
jobs:
 build:
   runs-on: ubuntu-latest # Specify the runner environment
 
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4 # Action to check out the repository code

     - name: Set up Python
       uses: actions/setup-python@v2
       with:
        python-version: '3.x'

 test:
   runs-on: ubuntu-latest # Specify the runner environment
   needs: build
   steps:
     - name: Install dependencies
       run: |
        python -m pip install --upgrade pip
        pip install Flask pytest
 
     - name: Run tests
       run: |
        pytest test_app.py

 deploy:
   runs-on: ubuntu-latest # Specify the runner environment
   needs: test
 
   steps:
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3 # Action to set up Docker Buildx for multi-platform builds
 
     - name: Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKER_USERNAME }} # Use GitHub Secrets for sensitive info
         password: ${{ secrets.DOCKER_PASSWORD }}
 
     - name: Build and push Docker image
       uses: docker/build-push-action@v5
       with:
         context: . # Path to the Dockerfile and build context
         push: true # Set to true to push the image to the registry
         tags: sanketkumbhar/python-flask-demo:latest # Image tag(s)
